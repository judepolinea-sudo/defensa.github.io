# Render Blueprint for Defensa.
# In Render: New + -> Blueprint -> connect this repo. Render reads this file,
# creates the service, and prompts you for each secret below (sync: false).
services:
  - type: web
    name: defensa
    runtime: node
    plan: free
    region: singapore          # closest region to the Philippines
    branch: master
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production npx tsx server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Firebase Admin (server side only) ---
      - key: FIREBASE_SERVICE_ACCOUNT      # the full service-account JSON, on one line
        sync: false
      # --- Supabase ---
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- First-admin bootstrap ---
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      # --- AI providers (at least one required; the rest are fallbacks) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # --- Transactional email (verification / password-reset / welcome) ---
      # Render's free tier BLOCKS outbound SMTP, so we send over an HTTPS API.
      # Use ONE of Brevo (recommended) or Resend:
      #   Brevo  — sign up at brevo.com, verify a sender address, make an API
      #            key. Sends to any recipient. 300 emails/day free.
      #   Resend — needs a verified domain to send to arbitrary recipients.
      - key: BREVO_API_KEY        # xkeysib-...   (or use RESEND_API_KEY instead)
        sync: false
      - key: RESEND_API_KEY       # re_...        (only if not using Brevo)
        sync: false
      - key: EMAIL_FROM           # Defensa <your-verified-sender@gmail.com>
        sync: false
      - key: APP_URL              # https://defensa-7ggt.onrender.com
        sync: false
      # "true" (default) requires a verified email before sign-in; "false" disables.
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
